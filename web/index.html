<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maild — Compose</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>✉️ Maild</h1>
  <p class="subtitle">Compose and send email from your domain</p>

  <form id="compose-form">
    <div class="field">
      <label for="from">From</label>
      <select id="from" name="from" required>
        <option value="">Loading senders…</option>
      </select>
    </div>

    <div class="field">
      <label for="to">To</label>
      <input type="email" id="to" name="to" placeholder="recipient@example.com" required autocomplete="off">
    </div>

    <div class="field">
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="Email subject" required autocomplete="off">
    </div>

    <div class="field">
      <label for="markdown">Body <span class="hint">(Markdown)</span></label>
      <textarea id="markdown" name="markdown" rows="16" placeholder="Write your message in Markdown…" required></textarea>
    </div>

    <div class="actions">
      <button type="button" id="preview-btn" class="secondary">Preview</button>
      <button type="submit" id="send-btn">Send</button>
    </div>
  </form>

  <div id="preview-panel" class="hidden">
    <h2>Preview</h2>
    <div id="preview-content"></div>
    <button type="button" id="close-preview" class="secondary">Close preview</button>
  </div>

  <div id="status" class="hidden"></div>
</main>
<script src="/app.js"></script>
</body>
</html>
