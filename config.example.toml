# maild configuration

[server]
# 监听地址 — 必须为 127.0.0.1，仅允许本机访问
address = "127.0.0.1:8080"
# 单封邮件附件总大小上限
max_attachment_size = "10MB"

[resend]
# Resend API Key — https://resend.com/api-keys
api_key = "re_xxxx"

[senders]
# 发件身份（标签 = 邮箱地址）
# WebUI 的下拉框将展示这些邮箱地址
me = "me@example.org"
contact = "contact@example.org"
